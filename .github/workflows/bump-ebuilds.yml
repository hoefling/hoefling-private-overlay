name: Update Gentoo ebuilds

on:
  pull_request:
    paths:
      - '.github/.renovate/packages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-ebuilds-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  bump-ebuilds:
    runs-on: ubuntu-latest

    container:
      image: gentoo/stage3:latest

    steps:
      - name: Install dependencies
        run: |
          cat > /etc/portage/binrepos.conf/gentoo.conf <<EOF
          [gentoo]
          priority = 9999
          sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
          verify-signature = true
          location = /var/cache/binhost/gentoo
          EOF
          printf 'FEATURES="getbinpkg binpkg-request-signature"\n' >> /etc/portage/make.conf

          emerge --sync --quiet
          emerge --oneshot --quiet --getbinpkg dev-vcs/git dev-util/pkgdev dev-python/pyyaml

      # A token other than GITHUB_TOKEN is required: pushes made with the
      # latter do not trigger other workflows (i.e. pkgcheck) on the PR.
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.BUMP_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update ebuilds
        run: .github/bin/bump-ebuild --commit

      - name: Regenerate metadata
        run: |
          egencache --update --jobs "$(nproc)" \
            --repo hoefling-private \
            --repositories-configuration "[hoefling-private]
          location = $GITHUB_WORKSPACE
          "
          git add --all metadata/md5-cache
          if ! git diff --cached --quiet; then
            git commit --quiet -m "metadata/md5-cache: update metadata"
          fi

      - name: Push changes
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}")" ]; then
            echo "No changes to push."
          else
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          fi
