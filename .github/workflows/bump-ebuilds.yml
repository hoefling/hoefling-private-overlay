name: Update Gentoo ebuilds

on:
  pull_request:
    paths:
      - '.github/.renovate/packages.yml'

permissions:
  contents: write

jobs:
  bump-ebuilds:
    runs-on: ubuntu-latest

    container:
      image: gentoo/stage3:latest

    steps:
      - name: Install dependencies
        run: |
          cat > /etc/portage/binrepos.conf/gentoo.conf <<EOF
          [gentoo]
          priority = 9999
          sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
          verify-signature = true
          location = /var/cache/binhost/gentoo
          EOF
          printf 'FEATURES="getbinpkg binpkg-request-signature"\n' >> /etc/portage/make.conf

          emerge --sync --quiet
          emerge --oneshot --quiet --getbinpkg dev-vcs/git dev-util/pkgdev dev-python/pyyaml

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Debug git state
        working-directory: ${{ github.workspace }}
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          ls -la
          ls -la "$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/.git" || true

          git status

          echo "HEAD:"
          git rev-parse HEAD

          echo "Base SHA:"
          echo "${{ github.event.pull_request.base.sha }}"

          echo "Base commit available:"
          git cat-file -e "${{ github.event.pull_request.base.sha }}^{commit}" \
            && echo yes \
            || echo no

          echo "Branches:"
          git branch -a

          echo "Remotes:"
          git remote -v

          echo "Log:"
          git log --oneline --all -10

      - name: Update ebuilds
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          .github/bin/bump-ebuild

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add app-admin net-vpn

          if git diff --cached --quiet; then
            echo "No ebuild changes"
            exit 0
          fi

          git commit -m 'chore: update Gentoo ebuilds'
          git push
